<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" role="img" aria-label="AI suggests a category, a human reviews it, the report is saved" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
 <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5df0a8" stop-opacity="0"/><stop offset="1" stop-color="#5df0a8" stop-opacity="0.45"/></linearGradient>
 <clipPath id="clipA"><rect x="40" y="50" width="400" height="260" rx="18"/></clipPath>
</defs>
<rect width="1200" height="380" rx="24" fill="#090e0f"/>
<text x="600" y="32" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="6" fill="#7b8a84">SUGGESTION, NEVER PROOF</text>

<!-- Panel A -->
<g>
 <rect x="40" y="50" width="400" height="260" rx="18" fill="#0c1213" stroke="#1b2a25"/>
 <g clip-path="url(#clipA)">
  <rect x="40" y="250" width="400" height="60" fill="#0f1816"/>
  <rect x="190" y="150" width="100" height="110" rx="6" fill="#18231f" stroke="#2f403a"/>
  <rect x="182" y="140" width="116" height="14" rx="5" fill="#1f2d28" stroke="#2f403a"/>
  <circle cx="215" cy="128" r="16" fill="#25332e"/><circle cx="250" cy="120" r="19" fill="#2b3a34"/><circle cx="278" cy="130" r="13" fill="#25332e"/>
  <rect x="40" y="50" width="400" height="60" fill="url(#scan)" opacity="0.0">
    <animate attributeName="y" dur="10s" repeatCount="indefinite" keyTimes="0;0.3;1" values="40;270;270"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.03;0.28;0.32;1" values="0;0.9;0.9;0;0"/>
  </rect>
  <rect x="40" y="108" width="400" height="2" fill="#5df0a8" opacity="0">
    <animate attributeName="y" dur="10s" repeatCount="indefinite" keyTimes="0;0.3;1" values="48;308;308"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.03;0.28;0.32;1" values="0;1;1;0;0"/>
  </rect>
 </g>
 <g stroke="#5df0a8" stroke-width="2.5" fill="none" stroke-linecap="round">
  <path d="M56 78V62H72"/><path d="M424 78V62H408"/><path d="M56 282V298H72"/><path d="M424 282V298H408"/>
 </g>
 <rect x="172" y="104" width="136" height="164" rx="6" fill="none" stroke="#5df0a8" stroke-width="2" stroke-dasharray="6 5" opacity="0">
  <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.3;0.36;0.85;0.92;1" values="0;0;1;1;0;0"/>
 </rect>
 <g opacity="0">
  <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.34;0.4;0.85;0.92;1" values="0;0;1;1;0;0"/>
  <rect x="172" y="78" width="168" height="22" rx="11" fill="#0d3b2a" stroke="#5df0a8"/>
  <text x="186" y="93" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#e7efeb">Visible overflow · suggested</text>
 </g>
 <text x="40" y="338" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.5" fill="#7b8a84">CONFIDENCE</text>
 <rect x="150" y="330" width="290" height="8" rx="4" fill="#141f1c"/>
 <rect x="150" y="330" width="0" height="8" rx="4" fill="#5df0a8"><animate attributeName="width" dur="10s" repeatCount="indefinite" keyTimes="0;0.32;0.5;0.9;1" values="0;0;225;225;0"/></rect>
 <text x="240" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="0"></text>
 <text x="56" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="0"></text>
</g>
<text x="240" y="372" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#e7efeb" opacity="0">1 · AI suggests<animate attributeName="opacity" values="0.4;1;0.4" dur="10s" repeatCount="indefinite" keyTimes="0;0.4;1"/></text>

<!-- arrow A->B -->
<path d="M452 180H508M498 170L510 180L498 190" stroke="#5df0a8" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></path>

<!-- Panel B -->
<g>
 <rect x="520" y="50" width="300" height="260" rx="18" fill="#0c1213" stroke="#1b2a25"/>
 <circle cx="570" cy="100" r="22" fill="#13201b" stroke="#5df0a8"/>
 <circle cx="570" cy="94" r="6" fill="none" stroke="#5df0a8" stroke-width="2"/><path d="M557 114c2-9 24-9 26 0" fill="none" stroke="#5df0a8" stroke-width="2" stroke-linecap="round"/>
 <text x="604" y="97" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#e7efeb">Human review</text>
 <text x="604" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#7b8a84">Confirm or correct the label</text>
 <rect x="548" y="150" width="244" height="40" rx="10" fill="#101a17" stroke="#1b2a25"/>
 <text x="566" y="175" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e7efeb">Category: overflowing bin</text>
 <rect x="548" y="214" width="116" height="40" rx="20" fill="none" stroke="#5df0a8" stroke-width="1.5">
   <animate attributeName="fill" dur="10s" repeatCount="indefinite" keyTimes="0;0.52;0.58;0.9;1" values="#0c1213;#0c1213;#0d3b2a;#0d3b2a;#0c1213"/></rect>
 <text x="606" y="239" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5df0a8">Confirm</text>
 <rect x="676" y="214" width="116" height="40" rx="20" fill="none" stroke="#1b2a25"/>
 <text x="734" y="239" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#7b8a84">Correct</text>
 <path d="M584 234l7 7 14-15" fill="none" stroke="#5df0a8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" style="stroke-dasharray:1;display:none"/>
 <circle cx="606" cy="234" r="0" fill="none" stroke="#5df0a8"><animate attributeName="r" dur="10s" repeatCount="indefinite" keyTimes="0;0.52;0.53;0.66;1" values="0;0;6;26;26"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.52;0.53;0.66;1" values="0;0;0.8;0;0"/></circle>
</g>
<text x="670" y="372" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#e7efeb">2 · A person decides</text>

<!-- arrow B->C -->
<path d="M832 180H888M878 170L890 180L878 190" stroke="#5df0a8" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="0.8s" repeatCount="indefinite"/></path>

<!-- Panel C -->
<g>
 <rect x="900" y="50" width="260" height="260" rx="18" fill="#0c1213" stroke="#1b2a25"/>
 <text x="928" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#e7efeb">Saved report</text>
 <text x="928" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#7b8a84">Status timeline</text>
 <line x1="940" y1="150" x2="940" y2="270" stroke="#1b2a25" stroke-width="2"/>
 <line x1="940" y1="150" x2="940" y2="270" stroke="#5df0a8" stroke-width="2" pathLength="1" style="stroke-dasharray:1"><animate attributeName="stroke-dashoffset" dur="10s" repeatCount="indefinite" keyTimes="0;0.55;0.8;0.95;1" values="1;1;0;0;1"/></line>
 <circle cx="940" cy="150" r="7" fill="#101a17" stroke="#1b2a25" stroke-width="2"><animate attributeName="stroke" calcMode="discrete" values="#1b2a25;#5df0a8;#1b2a25" keyTimes="0;0.1;0.95" dur="10s" repeatCount="indefinite"/></circle><text x="962" y="155" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e7efeb">Submitted</text><circle cx="940" cy="190" r="7" fill="#101a17" stroke="#1b2a25" stroke-width="2"><animate attributeName="stroke" calcMode="discrete" values="#1b2a25;#5df0a8;#1b2a25" keyTimes="0;0.45;0.95" dur="10s" repeatCount="indefinite"/></circle><text x="962" y="195" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e7efeb">AI suggestion saved</text><circle cx="940" cy="230" r="7" fill="#101a17" stroke="#1b2a25" stroke-width="2"><animate attributeName="stroke" calcMode="discrete" values="#1b2a25;#5df0a8;#1b2a25" keyTimes="0;0.6;0.95" dur="10s" repeatCount="indefinite"/></circle><text x="962" y="235" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e7efeb">Reviewed</text><circle cx="940" cy="270" r="7" fill="#101a17" stroke="#1b2a25" stroke-width="2"><animate attributeName="stroke" calcMode="discrete" values="#1b2a25;#5df0a8;#1b2a25" keyTimes="0;0.8;0.95" dur="10s" repeatCount="indefinite"/></circle><text x="962" y="275" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e7efeb">Ready to assign</text>
</g>
<text x="1030" y="372" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#e7efeb">3 · Saved and tracked</text>
</svg>